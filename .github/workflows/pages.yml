name: Deploy to GitHub Pages

# Pages serves this repo from the `gh-pages` branch, so this job stages the
# four things the site actually needs and force-pushes them there. GitHub's own
# "pages build and deployment" run then picks that up and publishes it.
#
# Publishing this way needs only `contents: write`, unlike the deploy-pages
# route, which needs a Pages site created through an API the workflow token is
# not permitted to call.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site/fonts
          cp index.html styles.css app.js _site/
          cp fonts/*.woff2 _site/fonts/
          touch _site/.nojekyll

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA:0:7}"
          git push -q --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
