name: Deploy to Pages

# Pages Source is set to "GitHub Actions", so this workflow *is* the deploy.
# Pushing to gh-pages no longer publishes anything.
#
# Background. With Source set to "Deploy from a branch", GitHub runs its
# own generated "pages build and deployment" workflow, which we cannot edit.
# Its deploy step gives up after 10 minutes and then *cancels* the deployment:
#
#   Current status: deployment_queued
#   ##[error]Timeout reached, aborting!
#   Canceling Pages deployment...
#
# Five consecutive deploys died exactly that way while the build step kept
# succeeding in ~5 seconds, so the payload was never the problem — the
# deployment was just slower than the timer, and got killed each time.
#
# Switching the source did not fix it: the deployment still sat at
# `deployment_queued` and was cancelled at ten minutes. The `timeout` input
# below asks for thirty; the action caps it, so it is documentation of intent
# rather than an effective lever. Six deploys failed the same way under both
# source modes, which puts the fault in GitHub's Pages pipeline, not here.
#
# Left wired to push so the next commit deploys by itself once Pages recovers.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # never cancel a deployment that is still working

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v5/v6 of these four are the Node 24 builds. The v4/v5/v3 pins below
      # declared Node 20, which the runner now force-upgrades while printing a
      # deprecation warning on every deploy.
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # From v5 setup-node caches automatically when package.json carries a
          # `packageManager` field. There is no lockfile committed here, so that
          # cache would only ever fail to find one. Off, explicitly.
          package-manager-cache: false

      - name: Build site
        run: node scripts/build.mjs

      - name: Stage site
        run: |
          cp -R dist _site
          touch _site/.nojekyll

          # Cache-bust the shared assets by content hash. Without this the
          # browser keeps a stylesheet from a previous deploy while taking the
          # new HTML, which shipped a page with the new markup and the old
          # palette. Hashing the contents (not the commit) means an unchanged
          # file keeps its URL and stays cached. Every built page references
          # /assets/site.css and /assets/site.js, so every page gets the sed.
          CSS_V=$(md5sum _site/assets/site.css | cut -c1-8)
          JS_V=$(md5sum _site/assets/site.js | cut -c1-8)
          mv _site/assets/site.css "_site/assets/site.$CSS_V.css"
          mv _site/assets/site.js "_site/assets/site.$JS_V.js"
          find _site -name '*.html' -exec sed -i \
            -e "s|/assets/site\.css|/assets/site.$CSS_V.css|g" \
            -e "s|/assets/site\.js|/assets/site.$JS_V.js|g" {} +
          echo "site.$CSS_V.css   site.$JS_V.js"
          grep -c "site\.$CSS_V\.css" _site/index.html

          # No base-path rewrite. The build emits root-absolute URLs (/assets/…,
          # /pricing) because the deployment target is a custom domain at its
          # root, and since Aug 18 2026 that domain has existed. It was
          # getvellumapp.com until Aug 27 2026 and is pocketchronicle.app now;
          # whichever it is, it is in site.config.json and the build writes
          # _site/CNAME from it, which is what tells Pages to serve here rather
          # than at /<repo-name>/. The rename did not change this reasoning — it
          # changed the host in the file the reasoning points at. Note the half
          # this workflow cannot do: Pages will keep serving the old custom
          # domain until it is changed in the repository's Pages settings, so a
          # green deploy here is not yet a live site on the new host.
          #
          # A prefixing pass used to live here for the project URL. It is gone
          # rather than switched off, because the two are mutually exclusive and
          # a dormant copy is a thing somebody re-enables: with the CNAME in the
          # artifact every one of those rewrites would point one directory too
          # deep and 404 the entire site. If the custom domain is ever given up,
          # clear ORIGIN in site.config.json (which stops the CNAME, canonicals
          # and sitemap together) and restore the rewrite from this file's
          # history — not from a commented-out block that drifted meanwhile.
          test -s _site/CNAME || { echo "no CNAME in the artifact — ORIGIN unset?"; exit 1; }
          echo "custom domain: $(cat _site/CNAME)"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # v4 of this action stopped including dotfiles by default, and the
          # staging step above writes _site/.nojekyll. Without this the artifact
          # silently loses it.
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000   # asks for 30 min; the action caps it at 10
