<header class="masthead">
  <div class="masthead__in">
    <!-- The drawn lockup, inlined rather than referenced, because an image element gets no
         pointer events and the fan could not open inside one. aria-label carries the name:
         the anchor has no text left to be named by, and check.mjs's alt pass only inspects
         image tags. That used to mean an anchor whose only content is artwork could lose
         its name on all 21 pages with the suite still green — closed in 2585d98, which
         fails any link or button that has no text and no accessible name, and is
         negative-tested by removing this very attribute. So the aria-label below is
         load-bearing AND enforced; do not drop it expecting a warning.

         This note used to end by telling you to keep tag names out of it, because the
         checker read comments and failed every page over prose that merely described a
         tag. True when written, fixed at the source the same day in b1edd78 — comments
         now come out of `body` before the markup passes. The instruction is struck rather
         than left standing: a warning about a bug that no longer exists is a rule nobody
         downstream can tell is obsolete. Write the comment you mean. -->
    <a class="wordmark brand" href="/" aria-label="{{PRODUCT}}">
      <svg viewBox="0 -163.8 260 163.8" aria-hidden="true" focusable="false">
        <defs>
        <mask id="vlh-k0" maskUnits="userSpaceOnUse" x="-400" y="-400" width="800" height="800">
          <rect x="-400" y="-400" width="800" height="800" fill="#fff"/>
          <g class="brand__card" style="--a:32;--i:2" transform="rotate(32) translate(0 -120)"><rect x="-56" y="-81" width="112" height="162" rx="28" fill="#000"/></g>
          <g class="brand__card" style="--a:-16;--i:1" transform="rotate(-16) translate(0 -120)"><rect x="-56" y="-81" width="112" height="162" rx="28" fill="#000"/></g>
          <g class="brand__card" style="--a:16;--i:1" transform="rotate(16) translate(0 -120)"><rect x="-56" y="-81" width="112" height="162" rx="28" fill="#000"/></g>
          <g class="brand__card" style="--a:0;--i:0" transform="rotate(0) translate(0 -120)"><rect x="-56" y="-81" width="112" height="162" rx="28" fill="#000"/></g>
        </mask>
        <mask id="vlh-k1" maskUnits="userSpaceOnUse" x="-400" y="-400" width="800" height="800">
          <rect x="-400" y="-400" width="800" height="800" fill="#fff"/>
          <g class="brand__card" style="--a:-16;--i:1" transform="rotate(-16) translate(0 -120)"><rect x="-56" y="-81" width="112" height="162" rx="28" fill="#000"/></g>
          <g class="brand__card" style="--a:16;--i:1" transform="rotate(16) translate(0 -120)"><rect x="-56" y="-81" width="112" height="162" rx="28" fill="#000"/></g>
          <g class="brand__card" style="--a:0;--i:0" transform="rotate(0) translate(0 -120)"><rect x="-56" y="-81" width="112" height="162" rx="28" fill="#000"/></g>
        </mask>
        <mask id="vlh-k2" maskUnits="userSpaceOnUse" x="-400" y="-400" width="800" height="800">
          <rect x="-400" y="-400" width="800" height="800" fill="#fff"/>
          <g class="brand__card" style="--a:16;--i:1" transform="rotate(16) translate(0 -120)"><rect x="-56" y="-81" width="112" height="162" rx="28" fill="#000"/></g>
          <g class="brand__card" style="--a:0;--i:0" transform="rotate(0) translate(0 -120)"><rect x="-56" y="-81" width="112" height="162" rx="28" fill="#000"/></g>
        </mask>
        <mask id="vlh-k3" maskUnits="userSpaceOnUse" x="-400" y="-400" width="800" height="800">
          <rect x="-400" y="-400" width="800" height="800" fill="#fff"/>
          <g class="brand__card" style="--a:0;--i:0" transform="rotate(0) translate(0 -120)"><rect x="-56" y="-81" width="112" height="162" rx="28" fill="#000"/></g>
        </mask>
        </defs>
        <g transform="translate(125.931 10.081) scale(0.864)">
          <g mask="url(#vlh-k0)"><g class="brand__card" style="--a:-32;--i:2" transform="rotate(-32) translate(0 -120)"><rect x="-50" y="-75" width="100" height="150" rx="22" fill="#ECCDBC"/></g></g>
          <g mask="url(#vlh-k1)"><g class="brand__card" style="--a:32;--i:2" transform="rotate(32) translate(0 -120)"><rect x="-50" y="-75" width="100" height="150" rx="22" fill="#ECCDBC"/></g></g>
          <g mask="url(#vlh-k2)"><g class="brand__card" style="--a:-16;--i:1" transform="rotate(-16) translate(0 -120)"><rect x="-50" y="-75" width="100" height="150" rx="22" fill="#DA9D7F"/></g></g>
          <g mask="url(#vlh-k3)"><g class="brand__card" style="--a:16;--i:1" transform="rotate(16) translate(0 -120)"><rect x="-50" y="-75" width="100" height="150" rx="22" fill="#DA9D7F"/></g></g>
          <g class="brand__card" style="--a:0;--i:0" transform="rotate(0) translate(0 -120)"><rect x="-50" y="-75" width="100" height="150" rx="22" fill="#C05A2B"/></g>
        </g>
      </svg>
      <span class="brand__word">{{PRODUCT}}</span>
    </a>

    <!-- <details> rather than a JS drawer. It is keyboard-operable and
         screen-reader-correct with no script, which matters on a site whose
         pitch is that it doesn't run things behind your back. -->
    <details class="navwrap">
      <summary class="navwrap__toggle" aria-label="Menu">
        <span class="navwrap__bars" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="navwrap__word">Menu</span>

      <nav class="nav" aria-label="Primary">

</header>
